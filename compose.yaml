# Pantry Chef via Compose. Works with Docker and with Podman.
#
#   docker compose up -d                 # Docker: compose v2 is built in
#   podman-compose up -d                 # Podman: pip install podman-compose
#
# `podman compose` (with a space) is only a shim and needs one of those
# providers installed anyway; the plain `podman run` commands in DEPLOY.md
# need nothing extra.
#
# Point BOOKS at your cookbooks. A .env file beside this one is read
# automatically, which is tidier than exporting it every time:
#
#   echo "BOOKS=/srv/cookbooks" > .env
#
# Then build the index THROUGH COMPOSE, so it lands in the same volume the
# service reads — Compose prefixes volume names with the project name, so a
# bare `docker run -v pantry-chef-data:/data` writes somewhere else entirely:
#
#   docker compose run --rm pantry-chef pantry-chef index /books

services:
  pantry-chef:
    build:
      context: .
      dockerfile: Containerfile
    image: pantry-chef:latest
    container_name: pantry-chef
    ports:
      # Bound to localhost only: this is a personal app with no authentication.
      - "127.0.0.1:8077:8077"
    volumes:
      # Your cookbooks, read-only. The app only ever reads them.
      - ${BOOKS:-./books}:/books:ro
      # The index and photo cache, so they survive the container.
      - pantry-chef-data:/data
    environment:
      PANTRY_CHEF_DB: /data/pantry-chef.db
    restart: unless-stopped

volumes:
  pantry-chef-data:
