# nginx in front of Pantry Chef, if you already run nginx.
# Certificates here are assumed to come from certbot.
#
#   sudo htpasswd -c /etc/nginx/.pantry-chef.htpasswd niels
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pantry-chef
#   sudo ln -s /etc/nginx/sites-available/pantry-chef /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name recipes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name recipes.example.com;

    ssl_certificate     /etc/letsencrypt/live/recipes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipes.example.com/privkey.pem;

    # Pantry Chef has NO authentication of its own. Without these two lines,
    # anyone who can reach this hostname can browse your entire library.
    auth_basic           "Pantry Chef";
    auth_basic_user_file /etc/nginx/.pantry-chef.htpasswd;

    gzip on;
    gzip_types text/css application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extracting a photo out of a book on first view takes a moment.
        proxy_read_timeout 60s;
    }
}
