<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pantry Chef">
  <title>Pantry Chef</title>
  <!-- The favicon is a heavier cut of the same mark: the contents line is
       dropped and the sprig thickened, because at 16px the line silts up and
       the stem disappears. -->
  <style>
    .tile { fill: #4a7c3f; }
    .cut  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #9ac97f; }
      .cut  { fill: #13170f; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <g transform="translate(0 1.6)">
  <rect class="cut" x="21" y="17.4" width="22" height="5.2" rx="2.4"/>
  <path class="cut" d="M24.6 22.6h14.8c2.2 2.8 4.1 4.8 4.1 8.4v12A6.6 6.6 0 0 1 36.9 49.6H27.1A6.6 6.6 0 0 1 20.5 43V31c0-3.6 1.9-5.6 4.1-8.4z"/>
  <rect class="cut" x="30.40" y="8.6" width="3.2" height="9.4" rx="1.60"/>
  <path class="cut" d="M31.6 12.6c-4.2-.4-7.3-4-6.9-8.2 4.2.4 7.3 4 6.9 8.2z"/>
  <path class="cut" d="M32.4 12.6c-.4-4.2 2.7-7.8 6.9-8.2.4 4.2-2.7 7.8-6.9 8.2z"/>
  </g>
</svg>
