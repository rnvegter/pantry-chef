<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe · Pantry Chef</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<style>
.card-page {
  max-width: 880px; margin: 0 auto; padding: 34px 30px 60px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; margin-top: 26px; margin-bottom: 40px;
}
.eyebrow {
  display: flex; align-items: center; gap: 18px;
  font-family: Georgia, "Iowan Old Style", serif;
  font-size: 15px; letter-spacing: 0.34em; text-transform: uppercase;
  font-weight: 700; justify-content: center;
}
.eyebrow::before, .eyebrow::after {
  content: ""; flex: 1; height: 2px; background: var(--ink);
}
.recipe-title {
  font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script",
               "Bradley Hand", cursive;
  font-size: clamp(38px, 7vw, 62px); font-weight: 600;
  text-align: center; margin: 10px 0 4px; line-height: 1.15;
  letter-spacing: 0.01em;
}
.byline { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 26px; }
.byline a { color: var(--accent); text-decoration: none; }

.hero {
  width: 100%; aspect-ratio: 3 / 2; object-fit: cover;
  border-radius: 14px; display: block; margin-bottom: 26px;
  background: var(--accent-soft);
}

.facts {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  padding: 16px 0 14px; margin-bottom: 30px; text-align: center;
}
.facts div + div { border-left: 1px solid var(--line); }
.facts svg { display: block; margin: 0 auto 8px; }
.facts .k {
  font-family: Georgia, serif; font-size: 12px; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--muted);
}
.facts .v { font-size: 16px; margin-top: 2px; }

.columns { display: grid; grid-template-columns: 300px 1fr; gap: 34px; align-items: start; }
.ingredients {
  background: var(--accent-soft); border-radius: 14px; padding: 22px 24px 26px;
}
.ingredients h2, .directions h2 {
  font-family: Georgia, "Iowan Old Style", serif; font-weight: 700;
  font-size: 22px; margin: 0 0 16px; letter-spacing: 0.01em;
}
.directions h2 { text-align: center; }
.ingredients ul { list-style: none; margin: 0; padding: 0; }
.ingredients li {
  padding: 7px 0 7px 22px; position: relative; font-size: 15px;
  border-bottom: 1px solid rgba(128,110,90,.14);
}
.ingredients li:last-child { border-bottom: 0; }
.ingredients li::before {
  content: "○"; position: absolute; left: 0; top: 7px; color: var(--muted);
}
.ingredients li.have::before { content: "●"; color: var(--ok); }
.ingredients li.staple { color: var(--muted); }
.ingredients li .why { display: block; font-size: 12px; color: var(--muted); }

.directions ol { margin: 0; padding-left: 22px; }
.directions li { margin-bottom: 12px; font-size: 15px; text-align: justify; }
.directions li::marker { font-weight: 700; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 22px; }
.tag {
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
  font-size: 12px; color: var(--muted); text-transform: capitalize;
}
.tag.warn { border-color: var(--warn); color: var(--warn); }

.tools {
  display: flex; gap: 10px; justify-content: center; align-items: center;
  flex-wrap: wrap; margin: 30px 0 0; padding-top: 22px;
  border-top: 1px solid var(--line);
}
.tools .note { margin-right: auto; }
.source {
  margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted); text-align: center;
}
.source b { color: var(--ink); font-weight: 600; }

@media (max-width: 720px) {
  .columns { grid-template-columns: 1fr; }
  .hero {
  width: 100%; aspect-ratio: 3 / 2; object-fit: cover;
  border-radius: 14px; display: block; margin-bottom: 26px;
  background: var(--accent-soft);
}

.facts { grid-template-columns: repeat(2, 1fr); gap: 14px 0; }
  .facts div:nth-child(3) { border-left: 0; }
}
@media print {
  body { background: #fff; }
  .card-page { border: 0; margin: 0; padding: 0; max-width: none; }
  .tools, nav, .wrap > header { display: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="var(--accent)"/>
        <g transform="translate(0 1.6)">
          <rect fill="var(--on-accent)" x="21" y="17.4" width="22" height="5.2" rx="2.4"/>
          <path fill="var(--on-accent)" d="M24.6 22.6h14.8c2.2 2.8 4.1 4.8 4.1 8.4v12A6.6 6.6 0 0 1 36.9 49.6H27.1A6.6 6.6 0 0 1 20.5 43V31c0-3.6 1.9-5.6 4.1-8.4z"/>
          <rect fill="var(--accent)" x="22.6" y="35.2" width="18.8" height="2.1" rx="1.05"/>
          <rect fill="var(--on-accent)" x="30.8" y="8.6" width="2.4" height="9.4" rx="1.2"/>
          <path fill="var(--on-accent)" d="M31.6 12.6c-4.2-.4-7.3-4-6.9-8.2 4.2.4 7.3 4 6.9 8.2z"/>
          <path fill="var(--on-accent)" d="M32.4 12.6c-.4-4.2 2.7-7.8 6.9-8.2.4 4.2-2.7 7.8-6.9 8.2z"/>
        </g>
      </svg>Pantry Chef<span>.</span></h1>
    <nav>
      <a href="/">Search</a>
      <a href="/library">Library</a>
    </nav>
  </header>

  <div id="page"><div class="empty">Loading the recipe…</div></div>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const recipeId = Number(location.pathname.split("/").pop());
const params = new URLSearchParams(location.search);
let units = params.get("units") || "metric";
const have = params.get("have") || "";

const ICONS = {
  servings: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M6 2v9M4 2v4a2 2 0 0 0 4 0V2M6 11v11"/>
    <path d="M17 2c-1.5 2-2 4-2 6s.5 3 2 3 2-1 2-3-.5-4-2-6zM17 11v11"/></svg>`,
  time: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  difficulty: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
    <path d="M6 20h12v-3H6zM6 17c-2.5-1-4-3-4-5.5A5.5 5.5 0 0 1 8.5 6a4.8 4.8 0 0 1 7 0
       A5.5 5.5 0 0 1 22 11.5c0 2.5-1.5 4.5-4 5.5"/></svg>`,
  count: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>`,
};

// Most specific first: a dessert filed under "lunch" should read as dessert.
const MEAL_PRIORITY = ["dessert", "breakfast", "snack", "side", "dinner", "lunch"];

function chooseCategory(r) {
  // The meal type leads, because it is derived and consistent. A book's own
  // chapter heading sounds better when it is real, but in practice many are
  // placeholders ("Chapter 3") or, worse, the previous recipe's title picked
  // up as a heading — so it is only a fallback.
  for (const meal of MEAL_PRIORITY) {
    if ((r.meals || []).includes(meal)) return meal;
  }
  const section = (r.section || "").trim();
  const useless = /^(chapter|part|section)\s*[\divxlc]*$/i.test(section);
  if (section && !useless && section.length <= 40) return section;
  return "Recipe";
}

function fmtTime(m, estimate) {
  if (m == null) return "—";
  const text = m < 60 ? m + " min"
    : (m % 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m / 60 + " h");
  return estimate ? "~" + text : text;
}

async function load() {
  const query = new URLSearchParams({ units });
  if (have) query.set("have", have);

  let r;
  try {
    const res = await fetch(`/api/recipe/${recipeId}?` + query);
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    r = await res.json();
  } catch (err) {
    document.getElementById("page").innerHTML =
      `<div class="empty">${esc(err.message)}</div>`;
    return;
  }

  document.title = r.title + " · Pantry Chef";
  const category = chooseCategory(r);

  const tags = [
    ...(r.cuisine ? [r.cuisine] : []),
    ...(r.diets || []).filter(d => d === "vegetarian" || d === "vegan"),
  ].map(t => `<span class="tag">${esc(t)}</span>`);
  if (r.allergens && r.allergens.length)
    tags.push(`<span class="tag warn">contains ${r.allergens.map(esc).join(", ")}</span>`);

  const ingredients = (r.ingredients || []).map(i => {
    const classes = [i.have ? "have" : "", i.staple ? "staple" : ""].filter(Boolean).join(" ");
    return `<li class="${classes}">${esc(i.line || i.display)}${
      i.staple ? `<span class="why">store cupboard</span>` : ""}</li>`;
  }).join("");

  const steps = (r.steps || []).length
    ? `<ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`
    : `<p class="note">No method was captured for this recipe — see the book, page ${r.page || "?"}.</p>`;

  const caveat = [
    r.diet_caveats || "",
    r.n_unknown ? `${r.n_unknown} ingredient${r.n_unknown > 1 ? "s" : ""} not recognised, so the allergen list may be incomplete` : "",
  ].filter(Boolean).join(" · ");

  document.getElementById("page").innerHTML = `
    <div class="card-page">
      <div class="eyebrow">${esc(category)}</div>
      <h2 class="recipe-title">${esc(r.title)}</h2>
      <div class="byline">
        from <b>${esc(r.book)}</b>${r.page ? `, page ${r.page}` : ""}
      </div>

      <div class="tags">${tags.join("")}</div>

      ${r.has_image ? `<img class="hero" src="${esc(r.image_url)}"
           alt="${esc(r.title)}" loading="lazy"
           onerror="this.remove()">` : ""}

      <div class="facts">
        <div>${ICONS.servings}<div class="k">Servings</div>
          <div class="v">${esc(r.servings || "—")}</div></div>
        <div>${ICONS.time}<div class="k">Time</div>
          <div class="v">${esc(fmtTime(r.total_minutes, r.time_is_estimate))}</div></div>
        <div>${ICONS.difficulty}<div class="k">Difficulty</div>
          <div class="v">${esc(r.difficulty || "—")}</div></div>
        <div>${ICONS.count}<div class="k">Ingredients</div>
          <div class="v">${(r.ingredients || []).length}</div></div>
      </div>

      <div class="columns">
        <div class="ingredients">
          <h2>Ingredients</h2>
          <ul>${ingredients}</ul>
        </div>
        <div class="directions">
          <h2>Directions</h2>
          ${steps}
        </div>
      </div>

      ${caveat ? `<div class="source" style="color:var(--warn)">${esc(caveat)}</div>` : ""}

      <div class="tools">
        <span class="note">Amounts shown in ${units === "metric" ? "metric" : "the book's original units"}.</span>
        <button class="ghost" id="units">Show ${units === "metric" ? "original units" : "metric"}</button>
        <button class="ghost" id="print">Print</button>
      </div>

      <div class="source">
        <b>${esc(r.book)}</b>${r.page ? ` · page ${r.page}` : ""}
        ${r.time_is_estimate ? " · time is estimated, not stated in the book" : ""}
      </div>
    </div>`;

  document.getElementById("units").onclick = () => {
    units = units === "metric" ? "original" : "metric";
    const next = new URLSearchParams(location.search);
    next.set("units", units);
    history.replaceState({}, "", location.pathname + "?" + next);
    load();
  };
  document.getElementById("print").onclick = () => window.print();
}

load();
</script>
</body>
</html>
