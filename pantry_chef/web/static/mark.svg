<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img"
     aria-label="Pantry Chef">
  <title>Pantry Chef</title>
  <!-- A store-cupboard jar with something fresh growing out of it: the two
       halves of the name in one shape. Two-tone on purpose — the vessel takes
       the ink colour, the growing part takes the accent, the same split as the
       green full stop in the wordmark. -->
  <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(0 0.7)">
    <g stroke="currentColor">
      <path d="M7.4 8.2h9.2"/>
      <path d="M9 8.2V7a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v1.2"/>
      <path d="M5.8 11.6a3.4 3.4 0 0 1 3.4-3.4h5.6a3.4 3.4 0 0 1 3.4 3.4v6.2A3.2 3.2 0 0 1 15 21H9a3.2 3.2 0 0 1-3.2-3.2z"/>
    </g>
    <g stroke="var(--accent, #4a7c3f)">
      <path d="M12 5.5V2.2"/>
      <path d="M12 4.6C10 4.6 8.4 3 8.4 1c2 0 3.6 1.6 3.6 3.6z"/>
      <path d="M12 4.6c0-2 1.6-3.6 3.6-3.6 0 2-1.6 3.6-3.6 3.6z"/>
    </g>
  </g>
</svg>
