<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry Chef · Library</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<style>
.add { display: flex; gap: 8px; flex-wrap: wrap; }
.add input { flex: 1 1 320px; }
.preview { margin-top: 10px; font-size: 14px; color: var(--muted); }
.preview b { color: var(--ink); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); font-weight: 500;
  padding: 0 10px 8px 0; }
td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line);
  vertical-align: top; }
td.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px; word-break: break-all; }
td.right { text-align: right; white-space: nowrap; }
tr.gone td { opacity: .6; }

.progress { margin-top: 14px; }
.track { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent);
  transition: width .3s ease; }
.track.idle i { background: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px;
  font-size: 14px; color: var(--muted); }
.counts b { color: var(--ink); }
.current { font-size: 14px; margin-top: 8px; color: var(--muted); }
.current b { color: var(--ink); font-weight: 500; }
.log { margin-top: 12px; }
.log pre {
  max-height: 260px; overflow: auto; background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; margin: 8px 0 0; color: var(--muted);
}

.issue { border-top: 1px solid var(--line); padding: 14px 0; }
.issue:first-of-type { border-top: 0; }
.issue h3 { margin: 0 0 4px; font-size: 15px; }
.issue .why { font-size: 14px; margin: 6px 0 0; }
.issue .fix { font-size: 14px; margin: 6px 0 0; color: var(--muted); }
.issue .fix b { color: var(--ink); font-weight: 500; }
.issue .raw { font-size: 12px; color: var(--muted); margin-top: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.issue .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.issue .row .right { margin-left: auto; }

dialog {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); padding: 0;
  width: min(560px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .head { padding: 16px 18px; border-bottom: 1px solid var(--line); }
dialog .head .path { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  color: var(--muted); word-break: break-all; margin-top: 4px; }
dialog .list { max-height: 46vh; overflow: auto; }
dialog .list button {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  color: inherit; font: inherit; padding: 9px 18px; cursor: pointer;
}
dialog .list button:hover { background: var(--accent-soft); color: var(--accent); }
dialog .foot { padding: 14px 18px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="var(--accent)"/>
        <g transform="translate(0 1.6)">
          <rect fill="var(--on-accent)" x="21" y="17.4" width="22" height="5.2" rx="2.4"/>
          <path fill="var(--on-accent)" d="M24.6 22.6h14.8c2.2 2.8 4.1 4.8 4.1 8.4v12A6.6 6.6 0 0 1 36.9 49.6H27.1A6.6 6.6 0 0 1 20.5 43V31c0-3.6 1.9-5.6 4.1-8.4z"/>
          <rect fill="var(--accent)" x="22.6" y="35.2" width="18.8" height="2.1" rx="1.05"/>
          <rect fill="var(--on-accent)" x="30.8" y="8.6" width="2.4" height="9.4" rx="1.2"/>
          <path fill="var(--on-accent)" d="M31.6 12.6c-4.2-.4-7.3-4-6.9-8.2 4.2.4 7.3 4 6.9 8.2z"/>
          <path fill="var(--on-accent)" d="M32.4 12.6c-.4-4.2 2.7-7.8 6.9-8.2.4 4.2-2.7 7.8-6.9 8.2z"/>
        </g>
      </svg>Pantry Chef<span>.</span></h1>
    <div class="stats" id="stats">loading…</div>
    <nav>
      <a href="/">Search</a>
      <a href="/library" aria-current="page">Library</a>
    </nav>
  </header>

  <div class="panel">
    <h2>Add a folder of cookbooks</h2>
    <div class="add">
      <input type="text" id="path" placeholder="/Users/you/Books/Cookbooks"
             autocomplete="off" aria-label="Folder path">
      <button class="ghost" id="browse">Browse…</button>
      <button class="go" id="add">Add folder</button>
    </div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="panel">
    <h2>Folders</h2>
    <div id="sources"><div class="empty">No folders yet. Add one above.</div></div>
  </div>

  <div class="panel">
    <h2>Indexing</h2>
    <div class="add">
      <button class="go" id="run">Index everything</button>
      <button class="ghost" id="runForce">Re-read every book</button>
      <button class="ghost" id="cancel" disabled>Stop</button>
    </div>
    <div class="note" style="margin-bottom:12px">Database: <span id="dbPath"></span></div>
    <div class="progress">
      <div class="track idle"><i id="bar" style="width:0%"></i></div>
      <div class="current" id="current"></div>
      <div class="counts" id="counts"></div>
      <details class="log">
        <summary class="note">Show the log</summary>
        <pre id="log">nothing yet</pre>
      </details>
    </div>
  </div>

  <div class="panel" id="issuesPanel" hidden>
    <h2>Needs attention <span class="badge bad" id="issueCount"></span></h2>
    <div id="issues"></div>
  </div>
</div>

<dialog id="picker">
  <div class="head">
    <b>Choose a folder</b>
    <div class="path" id="pickerPath"></div>
  </div>
  <div class="list" id="pickerList"></div>
  <div class="foot">
    <button class="ghost" id="pickerCancel">Cancel</button>
    <button class="go" id="pickerUse">Use this folder</button>
  </div>
</dialog>

<script src="/static/library.js" defer></script>
</body>
</html>
