<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry Chef · Library</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.add { display: flex; gap: 8px; flex-wrap: wrap; }
.add input { flex: 1 1 320px; }
.preview { margin-top: 10px; font-size: 14px; color: var(--muted); }
.preview b { color: var(--ink); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); font-weight: 500;
  padding: 0 10px 8px 0; }
td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line);
  vertical-align: top; }
td.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px; word-break: break-all; }
td.right { text-align: right; white-space: nowrap; }
tr.gone td { opacity: .6; }

.progress { margin-top: 14px; }
.track { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent);
  transition: width .3s ease; }
.track.idle i { background: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px;
  font-size: 14px; color: var(--muted); }
.counts b { color: var(--ink); }
.current { font-size: 14px; margin-top: 8px; color: var(--muted); }
.current b { color: var(--ink); font-weight: 500; }
.log { margin-top: 12px; }
.log pre {
  max-height: 260px; overflow: auto; background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; margin: 8px 0 0; color: var(--muted);
}

.issue { border-top: 1px solid var(--line); padding: 14px 0; }
.issue:first-of-type { border-top: 0; }
.issue h3 { margin: 0 0 4px; font-size: 15px; }
.issue .why { font-size: 14px; margin: 6px 0 0; }
.issue .fix { font-size: 14px; margin: 6px 0 0; color: var(--muted); }
.issue .fix b { color: var(--ink); font-weight: 500; }
.issue .raw { font-size: 12px; color: var(--muted); margin-top: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.issue .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.issue .row .right { margin-left: auto; }

dialog {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); padding: 0;
  width: min(560px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .head { padding: 16px 18px; border-bottom: 1px solid var(--line); }
dialog .head .path { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  color: var(--muted); word-break: break-all; margin-top: 4px; }
dialog .list { max-height: 46vh; overflow: auto; }
dialog .list button {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  color: inherit; font: inherit; padding: 9px 18px; cursor: pointer;
}
dialog .list button:hover { background: var(--accent-soft); color: var(--accent); }
dialog .foot { padding: 14px 18px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pantry Chef<span>.</span></h1>
    <div class="stats" id="stats">loading…</div>
    <nav>
      <a href="/">Search</a>
      <a href="/library" aria-current="page">Library</a>
    </nav>
  </header>

  <div class="panel">
    <h2>Add a folder of cookbooks</h2>
    <div class="add">
      <input type="text" id="path" placeholder="/Users/you/Books/Cookbooks"
             autocomplete="off" aria-label="Folder path">
      <button class="ghost" id="browse">Browse…</button>
      <button class="go" id="add">Add folder</button>
    </div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="panel">
    <h2>Folders</h2>
    <div id="sources"><div class="empty">No folders yet. Add one above.</div></div>
  </div>

  <div class="panel">
    <h2>Indexing</h2>
    <div class="add">
      <button class="go" id="run">Index everything</button>
      <button class="ghost" id="runForce">Re-read every book</button>
      <button class="ghost" id="cancel" disabled>Stop</button>
    </div>
    <div class="note" style="margin-bottom:12px">Database: <span id="dbPath"></span></div>
    <div class="progress">
      <div class="track idle"><i id="bar" style="width:0%"></i></div>
      <div class="current" id="current"></div>
      <div class="counts" id="counts"></div>
      <details class="log">
        <summary class="note">Show the log</summary>
        <pre id="log">nothing yet</pre>
      </details>
    </div>
  </div>

  <div class="panel" id="issuesPanel" hidden>
    <h2>Needs attention <span class="badge bad" id="issueCount"></span></h2>
    <div id="issues"></div>
  </div>
</div>

<dialog id="picker">
  <div class="head">
    <b>Choose a folder</b>
    <div class="path" id="pickerPath"></div>
  </div>
  <div class="list" id="pickerList"></div>
  <div class="foot">
    <button class="ghost" id="pickerCancel">Cancel</button>
    <button class="go" id="pickerUse">Use this folder</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let polling = null;
let pickerAt = "";

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

const json = (body) => ({
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body),
});

// --- adding a folder ------------------------------------------------------

let inspectTimer = null;
$("path").addEventListener("input", () => {
  clearTimeout(inspectTimer);
  inspectTimer = setTimeout(inspect, 400);
});

async function inspect() {
  const path = $("path").value.trim();
  if (!path) return ($("preview").textContent = "");
  const info = await api("/api/library/inspect", json({ path })).catch(e => ({ ok: false, error: e.message }));
  if (!info.ok) {
    $("preview").innerHTML = `<span style="color:var(--bad)">${esc(info.error)}</span>`;
    return;
  }
  const formats = Object.entries(info.by_format || {})
    .map(([k, v]) => `${v} ${k}`).join(", ");
  $("preview").innerHTML = info.books
    ? `Found <b>${info.books.toLocaleString()}</b> book${info.books === 1 ? "" : "s"}${formats ? " — " + esc(formats) : ""}`
    : `No supported ebooks found in that folder.`;
}

$("add").onclick = async () => {
  const path = $("path").value.trim();
  if (!path) return;
  try {
    await api("/api/library/sources", json({ path }));
    $("path").value = ""; $("preview").textContent = "";
    await load();
  } catch (err) {
    $("preview").innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`;
  }
};

// --- folder picker --------------------------------------------------------

$("browse").onclick = () => openPicker($("path").value.trim());
$("pickerCancel").onclick = () => $("picker").close();
$("pickerUse").onclick = () => {
  $("path").value = pickerAt;
  $("picker").close();
  inspect();
};

async function openPicker(at) {
  const data = await api("/api/library/browse?path=" + encodeURIComponent(at || ""));
  pickerAt = data.path || "";
  $("pickerPath").textContent = pickerAt;
  const rows = [];
  if (data.parent) rows.push(`<button data-p="${esc(data.parent)}">↑ ..</button>`);
  for (const d of data.directories || []) rows.push(`<button data-p="${esc(d.path)}">${esc(d.name)}</button>`);
  $("pickerList").innerHTML = rows.join("") || `<div class="empty">No sub-folders here.</div>`;
  $("pickerList").querySelectorAll("button").forEach(b =>
    b.onclick = () => openPicker(b.dataset.p));
  if (!$("picker").open) $("picker").showModal();
}

// --- indexing -------------------------------------------------------------

$("run").onclick = () => startRun(false);
$("runForce").onclick = () => startRun(true);
$("cancel").onclick = async () => {
  await api("/api/library/job/cancel", json({}));
  poll();
};

async function startRun(force, paths) {
  try {
    render(await api("/api/library/index", json({ force, paths: paths || [] })));
    watch();
  } catch (err) {
    $("current").innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`;
  }
}

function watch() {
  clearInterval(polling);
  polling = setInterval(poll, 700);
}

async function poll() {
  const job = await api("/api/library/job").catch(() => null);
  if (!job) return;
  render(job);
  if (job.status !== "running") {
    clearInterval(polling);
    polling = null;
    load();
  }
}

function secs(v) {
  if (!v) return "";
  return v < 60 ? `${Math.round(v)}s` : `${Math.floor(v / 60)}m ${Math.round(v % 60)}s`;
}

function render(job) {
  const running = job.status === "running";
  $("run").disabled = running;
  $("runForce").disabled = running;
  $("cancel").disabled = !running;
  $("bar").style.width = (job.percent || 0) + "%";
  document.querySelector(".track").classList.toggle("idle", !running);

  $("current").innerHTML = running && job.current
    ? `Reading <b>${esc(job.current)}</b>`
    : esc(job.message || "");

  const parts = [];
  if (job.total) parts.push(`<span><b>${job.done}</b> of ${job.total} books</span>`);
  if (job.recipes) parts.push(`<span><b>${job.recipes.toLocaleString()}</b> recipes</span>`);
  if (job.skipped) parts.push(`<span><b>${job.skipped}</b> unchanged</span>`);
  if (job.failed) parts.push(`<span style="color:var(--bad)"><b>${job.failed}</b> failed</span>`);
  if (job.elapsed) parts.push(`<span>${secs(job.elapsed)} elapsed</span>`);
  if (running && job.eta) parts.push(`<span>~${secs(job.eta)} left</span>`);
  $("counts").innerHTML = parts.join("");

  if (job.log && job.log.length) {
    const pre = $("log");
    pre.textContent = job.log.join("\n");
    pre.scrollTop = pre.scrollHeight;
  }
}

// --- the library ----------------------------------------------------------

async function load() {
  const data = await api("/api/library").catch(() => null);
  if (!data) return;
  const s = data.stats;

  $("stats").textContent =
    `${s.recipes.toLocaleString()} recipes from ${s.books.toLocaleString()} books`;
  $("dbPath").textContent = data.database;

  $("sources").innerHTML = data.sources.length ? `<table>
    <thead><tr><th>Folder</th><th>Books</th><th>Last indexed</th><th></th></tr></thead>
    <tbody>${data.sources.map(src => `
      <tr class="${src.exists ? "" : "gone"}">
        <td class="path">${esc(src.path)}
          ${src.exists ? "" : `<div class="note" style="color:var(--bad)">${esc(src.error || "missing")}</div>`}</td>
        <td>${src.exists ? src.books_on_disk.toLocaleString() : "—"}
          <div class="note">${esc(Object.entries(src.by_format || {}).map(([k, v]) => `${v} ${k}`).join(", "))}</div></td>
        <td class="note">${src.last_indexed ? esc(src.last_indexed) : "never"}</td>
        <td class="right">
          <button class="ghost" data-index="${esc(src.path)}">Index</button>
          <button class="ghost" data-remove="${src.id}">Remove</button>
        </td>
      </tr>`).join("")}</tbody></table>`
    : `<div class="empty">No folders yet. Add one above.</div>`;

  $("sources").querySelectorAll("[data-index]").forEach(b =>
    b.onclick = () => startRun(false, [b.dataset.index]));
  $("sources").querySelectorAll("[data-remove]").forEach(b =>
    b.onclick = async () => { await api("/api/library/sources/" + b.dataset.remove, { method: "DELETE" }); load(); });

  const issues = [
    ...data.failures.map(f => ({ ...f, kind: "failed" })),
    ...data.empty.map(f => ({ ...f, kind: "empty" })),
  ];
  $("issuesPanel").hidden = issues.length === 0;
  $("issueCount").textContent = issues.length;
  $("issues").innerHTML = issues.map(issue => `
    <div class="issue">
      <div class="row">
        <h3>${esc(issue.name)}</h3>
        <span class="badge ${issue.kind === "failed" ? "bad" : "short"}">
          ${issue.kind === "failed" ? "could not read" : "no recipes found"}</span>
        <span class="right">
          <button class="ghost" data-retry="${esc(issue.path)}">Retry</button>
        </span>
      </div>
      <p class="why">${esc(issue.cause)}</p>
      <p class="fix"><b>Fix:</b> ${esc(issue.fix)}</p>
      ${issue.error ? `<div class="raw">${esc(issue.error)}</div>` : ""}
    </div>`).join("");

  $("issues").querySelectorAll("[data-retry]").forEach(b =>
    b.onclick = async () => {
      try { render(await api("/api/library/retry", json({ path: b.dataset.retry }))); watch(); }
      catch (err) { alert(err.message); }
    });

  if (data.job && data.job.status === "running") { render(data.job); watch(); }
  else if (data.job) render(data.job);
}

load();
</script>
</body>
</html>
