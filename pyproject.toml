[project]
name = "pantry-chef"
version = "0.1.0"
description = "Pantry Chef — search a library of digital cookbooks by the ingredients you have and the time you've got"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# EPUB is handled with the standard library alone; these add the other formats.
pdf = ["pymupdf>=1.24"]
kindle = ["mobi>=0.3"]
all = ["pymupdf>=1.24", "mobi>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=1.11"]

[project.scripts]
pantry-chef = "pantry_chef.cli:main"

[tool.ruff]
# The code was written to roughly this width; 88 would mean reflowing 70-odd
# comment and string lines for no behavioural gain.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes — unused imports and names
    "I",         # import order
    "B",         # bugbear — likely bugs
    "SIM",       # simplifications
    "UP",        # outdated idioms
    "C4",        # comprehensions
    "PIE", "ISC", "FLY", "PYI", "RUF",
    "BLE",       # blind excepts, each of which should be a documented choice
]
ignore = [
    # The interface and its comments use real typography — "·", "—", "’". This
    # rule is for catching homoglyph attacks in identifiers, not prose.
    "RUF001", "RUF003",
    # Rewrites `"""a b c""".split()` into a list literal. The lexicon keeps its
    # word lists as multi-line strings precisely so a person can read and edit
    # them; applying this collapsed one into a 4,353-character line.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# The tests add the project root to sys.path before importing it, so their
# imports cannot all sit at the top of the file.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["pantry_chef"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# PyMuPDF and the Kindle reader ship no type information.
module = ["pymupdf", "fitz", "mobi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pantry_chef*"]

[tool.setuptools.package-data]
"pantry_chef.web" = ["static/*"]
